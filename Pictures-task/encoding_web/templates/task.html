<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מטלת קידוד</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="task-body">

  <!-- Progress bar -->
  <div class="progress-bar-wrap">
    <div id="progress-bar" class="progress-bar" style="width:0%"></div>
  </div>
  <div id="progress-label" class="progress-label">1 / {{ total }}</div>

  <!-- Main task area -->
  <div class="task-card" id="task-card">

    <!-- Image -->
    <div class="image-wrap">
      <img id="stimulus" src="" alt="" class="stimulus-img" style="opacity:0">
    </div>

    <!-- Fixation cross -->
    <div id="fixation" class="fixation hidden">+</div>

    <!-- Incidental judgment question -->
    <div id="question-panel" class="question-panel hidden">
      <p class="question-text">האם הציור נראה כאילו צוייר על ידי אומן מתחיל או מקצוען?</p>
      <div class="btn-row" style="justify-content:center;gap:3rem;margin-top:0.8rem">
        <span class="key-hint"><kbd>1</kbd> מתחיל</span>
        <span class="key-hint"><kbd>2</kbd> מקצוען</span>
      </div>
    </div>

    <!-- Loading overlay -->
    <div id="loading-overlay" class="loading-overlay">
      <div class="spinner"></div>
    </div>

  </div>

  <!-- Background music (music block only) -->
  {% if song_url %}
  <audio id="bg-music" src="{{ song_url }}" loop preload="auto"></audio>
  {% endif %}

  <!-- Config data for JS -->
  <div id="config"
    data-image-duration="{{ image_duration_ms }}"
    data-isi-min="{{ isi_min_ms }}"
    data-isi-max="{{ isi_max_ms }}"
    data-question-prob="{{ question_prob }}"
    data-has-music="{{ 'true' if song_url else 'false' }}"
    style="display:none">
  </div>

  <script src="{{ url_for('static', filename='task.js') }}"></script>
  <script>EncodingTask.init();</script>
</body>
</html>
