<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מטלת קידוד – הגדרות</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container setup-container">
    <h1 class="setup-title">מטלת קידוד</h1>
    <p class="setup-subtitle">הגדר/י את פרטי הסשן לפני התחלת המטלה</p>

    <form action="/start" method="post" class="setup-form" autocomplete="off">

      <div class="form-group">
        <label for="participant_id">מזהה משתתף/ת</label>
        <input type="text" id="participant_id" name="participant_id" required placeholder="למשל: P01">
      </div>

      <div class="form-group">
        <label for="session">סשן</label>
        <select id="session" name="session" required>
          <option value="">-- בחר/י --</option>
          <option value="Baseline">Baseline</option>
          <option value="Psilocybin">Psilocybin</option>
        </select>
      </div>

      <div class="form-group">
        <label for="participant_list">רשימת משתתף/ת (1–4)</label>
        <select id="participant_list" name="participant_list" required>
          <option value="">-- בחר/י --</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
        </select>
      </div>

      <div class="form-group form-group--checkbox">
        <input type="checkbox" id="test_mode" name="test_mode">
        <label for="test_mode">מצב בדיקה – 5 תמונות בלבד</label>
      </div>

      <button type="submit" class="btn-start">התחל/י מטלת קידוד</button>
    </form>
  </div>
</body>
</html>
