<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>אני מעונין להשתתף במחקר פסילוסיבין</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f0ebf8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
    }

    .form-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(103, 58, 183, 0.12);
      width: 100%;
      max-width: 620px;
      overflow: hidden;
    }

    .form-header {
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      padding: 32px 28px 24px;
      color: white;
    }

    .form-header h1 {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .form-header p {
      font-size: 14px;
      opacity: 0.88;
      line-height: 1.6;
    }

    .form-body {
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 14px;
      font-weight: 600;
      color: #374151;
    }

    label .required {
      color: #dc2626;
      margin-right: 2px;
    }

    input[type="text"],
    input[type="tel"],
    input[type="email"],
    input[type="date"] {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      color: #111827;
      background: #fafafa;
      transition: border-color 0.2s, box-shadow 0.2s;
      font-family: inherit;
    }

    input:focus {
      outline: none;
      border-color: #7c3aed;
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
      background: #fff;
    }

    input[type="date"] {
      direction: ltr;
      text-align: right;
    }

    .submit-btn {
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 13px 28px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      font-family: inherit;
      margin-top: 8px;
      align-self: flex-start;
    }

    .submit-btn:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .success-message {
      display: none;
      background: #ecfdf5;
      border: 1px solid #6ee7b7;
      border-radius: 8px;
      padding: 16px;
      color: #065f46;
      font-size: 15px;
      text-align: center;
      font-weight: 600;
    }

    .footer-note {
      margin-top: 16px;
      font-size: 12px;
      color: #9ca3af;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="form-card">
    <div class="form-header">
      <h1>אני מעונין/ת להשתתף במחקר פסילוסיבין</h1>
      <p>אנא מלא/י את הפרטים הבאים ונחזור אליך בהקדם האפשרי.</p>
    </div>

    <form class="form-body" id="researchForm" novalidate>

      <div class="field-group">
        <label for="name">שם מלא <span class="required">*</span></label>
        <input type="text" id="name" name="name" placeholder="שם פרטי ומשפחה" required />
      </div>

      <div class="field-group">
        <label for="phone">טלפון <span class="required">*</span></label>
        <input type="tel" id="phone" name="phone" placeholder="05X-XXXXXXX" required />
      </div>

      <div class="field-group">
        <label for="email">מייל <span class="required">*</span></label>
        <input type="email" id="email" name="email" placeholder="example@email.com" required />
      </div>

      <div class="field-group">
        <label for="dob">תאריך לידה <span class="required">*</span></label>
        <input type="date" id="dob" name="dob" required />
      </div>

      <div class="success-message" id="successMsg">
        ✅ הפרטים נשלחו בהצלחה! נחזור אליך בהקדם.
      </div>

      <button type="submit" class="submit-btn">שלח טופס</button>
    </form>
  </div>

  <p class="footer-note">הפרטים ישמרו בסודיות מוחלטת וישמשו לצורכי המחקר בלבד.</p>

  <script>
    document.getElementById("researchForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const name  = document.getElementById("name").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const email = document.getElementById("email").value.trim();
      const dob   = document.getElementById("dob").value;

      if (!name || !phone || !email || !dob) {
        alert("אנא מלא/י את כל השדות המסומנים.");
        return;
      }

      document.getElementById("successMsg").style.display = "block";
      this.querySelector(".submit-btn").disabled = true;
      this.querySelector(".submit-btn").textContent = "נשלח ✓";
    });
  </script>

</body>
</html>
